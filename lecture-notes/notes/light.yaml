    text: "Light travels from glass into air. The angle of incidence is increased steadily from 0°. Which describes what happens at the moment the angle of incidence becomes greater than the critical angle?"
    options:
      - The refracted ray bends towards the normal.
      - The refracted ray disappears and all the light is reflected inside the glass.
      - The light passes straight through without bending.
      - The reflected ray disappears.
    answer: B
    explain: "Beyond the critical angle no light can refract out. All of it is reflected: total internal reflection."

