<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Fredoka, Nunito, sans-serif" role="img" aria-label="A jar with honey at the bottom, water in the middle and oil on top. A cork floats on the oil, a grape rests on the honey, and a steel coin lies on the bottom">
  <rect x="120" y="170" width="120" height="70" fill="#ffc94a"/>
  <rect x="120" y="100" width="120" height="70" fill="#9cc0ff"/>
  <rect x="120" y="50" width="120" height="50" fill="#fff1a8"/>
  <path d="M120 20 V240 H240 V20" fill="none" stroke="#172033" stroke-width="3.5"/>
  <g font-size="12" font-weight="700" fill="#172033" text-anchor="end">
    <text x="110" y="80">oil · 0.92</text><text x="110" y="140">water · 1.00</text><text x="110" y="210">honey · 1.42</text>
  </g>
  <text x="110" y="34" font-size="10" fill="#566079" text-anchor="end">density in g/cm³</text>
  <!-- cork floating on oil -->
  <rect x="150" y="38" width="30" height="18" rx="4" fill="#c98a4b" stroke="#172033" stroke-width="2"/>
  <!-- grape resting on the honey -->
  <circle cx="200" cy="160" r="10" fill="#7a4dff" stroke="#172033" stroke-width="2"/>
  <!-- steel coin on the bottom -->
  <ellipse cx="170" cy="234" rx="16" ry="5" fill="#8a93a8" stroke="#172033" stroke-width="2"/>
  <g stroke="#172033" stroke-width="1.2"><line x1="180" y1="44" x2="262" y2="44"/><line x1="210" y1="160" x2="262" y2="160"/><line x1="186" y1="234" x2="262" y2="234"/></g>
  <g font-size="12" font-weight="700" fill="#172033">
    <text x="266" y="48">cork · 0.24</text><text x="266" y="164">grape · about 1.1</text><text x="266" y="238">steel coin · 7.8</text>
  </g>
</svg>
