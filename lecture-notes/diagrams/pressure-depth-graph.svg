<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" font-family="Nunito, sans-serif" role="img" aria-label="Graph of pressure against depth in seawater. Total pressure rises in a straight line from 100 kPa at the surface to 306 kPa at 20 m; pressure due to the water alone rises from 0 to 206 kPa">
  <!-- plot: x 50..250 is 0..20 m (10 per m); y 170..30 is 0..350 kPa (0.4 per kPa) -->
  <g stroke="#e3e7ee" stroke-width="0.8">
    <line x1="50" y1="130" x2="250" y2="130"/><line x1="50" y1="90" x2="250" y2="90"/><line x1="50" y1="50" x2="250" y2="50"/>
    <line x1="100" y1="30" x2="100" y2="170"/><line x1="150" y1="30" x2="150" y2="170"/><line x1="200" y1="30" x2="200" y2="170"/><line x1="250" y1="30" x2="250" y2="170"/>
  </g>
  <line x1="50" y1="170" x2="254" y2="170" stroke="#1d2433" stroke-width="1.3"/>
  <line x1="50" y1="170" x2="50" y2="26" stroke="#1d2433" stroke-width="1.3"/>
  <g font-size="9" fill="#5d6577" text-anchor="end"><text x="45" y="173">0</text><text x="45" y="133">100</text><text x="45" y="93">200</text><text x="45" y="53">300</text></g>
  <g font-size="9" fill="#5d6577" text-anchor="middle"><text x="50" y="182">0</text><text x="100" y="182">5</text><text x="150" y="182">10</text><text x="200" y="182">15</text><text x="250" y="182">20</text></g>
  <text x="150" y="196" font-size="10" font-weight="700" fill="#1d2433" text-anchor="middle">depth h / m</text>
  <text x="14" y="100" font-size="10" font-weight="700" fill="#1d2433" text-anchor="middle" transform="rotate(-90 14 100)">pressure p / kPa</text>
  <line x1="50" y1="170" x2="250" y2="87.6" stroke="#3563c9" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="50" y1="130" x2="250" y2="47.6" stroke="#d4533b" stroke-width="2.4"/>
  <circle cx="50" cy="130" r="3" fill="#d4533b"/><circle cx="250" cy="47.6" r="3" fill="#d4533b"/><circle cx="250" cy="87.6" r="3" fill="#3563c9"/>
  <text x="244" y="41" font-size="10" font-weight="900" fill="#d4533b" text-anchor="end">306</text>
  <text x="244" y="81" font-size="10" font-weight="900" fill="#3563c9" text-anchor="end">206</text>
  <line x1="58" y1="38" x2="76" y2="38" stroke="#d4533b" stroke-width="2.4"/><text x="80" y="41" font-size="10" font-weight="800" fill="#1d2433">total pressure</text>
  <line x1="58" y1="53" x2="76" y2="53" stroke="#3563c9" stroke-width="2" stroke-dasharray="5 3"/><text x="80" y="56" font-size="10" font-weight="800" fill="#1d2433">due to the water only</text>
</svg>
