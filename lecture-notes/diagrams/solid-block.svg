<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" font-family="Nunito, sans-serif" role="img" aria-label="The same 20 N block resting on its largest face and on its smallest face">
  <line x1="20" y1="160" x2="360" y2="160" stroke="#1d2433" stroke-width="1.5"/>
  <!-- A: lying flat, 20 x 10 face down, 5 cm tall -->
  <polygon points="40,130 70,110 190,110 160,130" fill="#c6e6e3" stroke="#0f6e74" stroke-width="1.5"/>
  <polygon points="160,130 190,110 190,140 160,160" fill="#a9d6d2" stroke="#0f6e74" stroke-width="1.5"/>
  <rect x="40" y="130" width="120" height="30" fill="#e5f3f2" stroke="#0f6e74" stroke-width="1.5"/>
  <text x="100" y="176" font-size="11" fill="#1d2433" text-anchor="middle">20 cm</text>
  <text x="34" y="149" font-size="11" fill="#1d2433" text-anchor="end">5 cm</text>
  <text x="196" y="124" font-size="11" fill="#1d2433">10 cm</text>
  <text x="100" y="195" font-size="12" font-weight="900" fill="#0f6e74" text-anchor="middle">A · lying flat</text>
  <!-- B: standing on end, 10 x 5 face down, 20 cm tall -->
  <polygon points="270,40 300,20 330,20 300,40" fill="#c6e6e3" stroke="#0f6e74" stroke-width="1.5"/>
  <polygon points="300,40 330,20 330,140 300,160" fill="#a9d6d2" stroke="#0f6e74" stroke-width="1.5"/>
  <rect x="270" y="40" width="30" height="120" fill="#e5f3f2" stroke="#0f6e74" stroke-width="1.5"/>
  <text x="285" y="176" font-size="11" fill="#1d2433" text-anchor="middle">5 cm</text>
  <text x="264" y="104" font-size="11" fill="#1d2433" text-anchor="end">20 cm</text>
  <text x="336" y="36" font-size="11" fill="#1d2433">10 cm</text>
  <text x="300" y="195" font-size="12" font-weight="900" fill="#0f6e74" text-anchor="middle">B · on its end</text>
</svg>
