<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 272" font-family="Nunito, sans-serif" role="img" aria-label="Refraction through a rectangular glass block: the ray bends towards the normal on entering and away from the normal on leaving, emerging parallel to the incident ray">
  <rect x="90" y="80" width="240" height="110" fill="#e5f3f2" stroke="#0f6e74" stroke-width="1.8"/>
  <line x1="160.0" y1="80.0" x2="274.9" y2="176.4" stroke="#5d6577" stroke-width="1" stroke-dasharray="3 4" stroke-linecap="round"/>
  <line x1="160.0" y1="38.0" x2="160.0" y2="122.0" stroke="#5d6577" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/>
  <line x1="225.3" y1="148.0" x2="225.3" y2="232.0" stroke="#5d6577" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/>
  <line x1="94.9" y1="25.4" x2="160.0" y2="80.0" stroke="#d4533b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="130.2,55.0 122.8,52.7 126.6,48.1" fill="#d4533b"/>
  <line x1="160.0" y1="80.0" x2="225.3" y2="190.0" stroke="#d4533b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="194.5,138.1 188.3,133.4 193.4,130.4" fill="#d4533b"/>
  <line x1="225.3" y1="190.0" x2="279.0" y2="235.0" stroke="#d4533b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="254.9,214.8 247.5,212.5 251.3,207.9" fill="#d4533b"/>
  <path d="M137.0 60.7 A30 30 0 0 1 160.0 50.0" fill="none" stroke="#1d2433" stroke-width="1.2"/>
  <path d="M160.0 110.0 A30 30 0 0 0 175.3 105.8" fill="none" stroke="#1d2433" stroke-width="1.2"/>
  <text x="147.0" y="44.0" font-size="12.5" font-weight="900" fill="#1d2433" text-anchor="middle" font-style="italic">i</text>
  <text x="169.0" y="124.0" font-size="12.5" font-weight="900" fill="#1d2433" text-anchor="middle" font-style="italic">r</text>
  <text x="322.0" y="98.0" font-size="10.5" font-weight="800" fill="#0f6e74" text-anchor="end">glass (optically denser)</text>
  <text x="20.0" y="30.0" font-size="11" font-weight="800" fill="#5d6577" text-anchor="start">air</text>
  <text x="174.0" y="54.0" font-size="10" font-weight="800" fill="#d4533b" text-anchor="start">bends towards the normal</text>
  <text x="213.3" y="212.0" font-size="10" font-weight="800" fill="#d4533b" text-anchor="end">bends away from the normal</text>
  <text x="283.0" y="251.0" font-size="9.5" font-weight="700" fill="#5d6577" text-anchor="end">emergent ray, parallel to incident ray</text>
</svg>
