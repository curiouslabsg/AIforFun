<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 235" font-family="Nunito, sans-serif" role="img" aria-label="U-tube manometer connected to a gas supply. The liquid is pushed down on the gas side and stands higher by h in the open arm">
  <defs><marker id="mn-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1d2433"/></marker>
  <marker id="mn-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d4533b"/></marker></defs>
  <g fill="none" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M14 40 H100 V170 A40 40 0 0 0 180 170 V40" stroke="#1d2433" stroke-width="22"/>
    <path d="M14 40 H100 V170 A40 40 0 0 0 180 170 V40" stroke="#ffffff" stroke-width="18"/>
    <path d="M100 135 V170 A40 40 0 0 0 180 170 V85" stroke="#9fd0ea" stroke-width="18"/>
  </g>
  <rect x="160" y="30" width="40" height="10" fill="#ffffff"/>
  <text x="18" y="24" font-size="10.5" font-weight="800" fill="#1d2433">gas supply</text>
  <text x="40" y="80" font-size="10.5" font-weight="900" fill="#d4533b">p<tspan baseline-shift="sub" font-size="8">gas</tspan></text>
  <line x1="180" y1="6" x2="180" y2="36" stroke="#d4533b" stroke-width="2.5" marker-end="url(#mn-a)"/>
  <text x="188" y="18" font-size="10.5" font-weight="900" fill="#d4533b">p<tspan baseline-shift="sub" font-size="8">atm</tspan> (open end)</text>
  <line x1="111" y1="135" x2="262" y2="135" stroke="#5d6577" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="191" y1="85" x2="262" y2="85" stroke="#5d6577" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="252" y1="89" x2="252" y2="131" stroke="#1d2433" stroke-width="1.3" marker-start="url(#mn-k)" marker-end="url(#mn-k)"/>
  <text x="258" y="114" font-size="13" font-weight="900" fill="#1d2433">h</text>
  <text x="140" y="230" font-size="10" fill="#5d6577" text-anchor="middle">liquid of density ρ</text>
</svg>
